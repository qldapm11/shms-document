    <style>
      .wiki-body { max-width: 900px; line-height: 1.7; color: #1f2937; }
      .wiki-body h1, .wiki-body h2, .wiki-body h3 { color: #0d47a1; margin-top: 1.4em; }
      .wiki-body h1 { border-bottom: 2px solid #e3f2fd; padding-bottom: 8px; }
      .wiki-body table { border-collapse: collapse; width: 100%; margin: 12px 0; }

      .wiki-body th { background: #e3f2fd; }
      .wiki-body code { background: #f5f5f5; padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
      .wiki-body pre { background: #263238; color: #eceff1; padding: 14px; border-radius: 6px; overflow: auto; }
      .wiki-body pre code { background: transparent; color: inherit; }
      .wiki-body blockquote { border-left: 4px solid #1565c0; margin: 12px 0; padding: 4px 16px; color: #546e7a; background: #f8f9fa; }
